; ============================================================================
;  PlatformIO project -- AI 3D Structural Inspection System, ESP32-CAM node
; ============================================================================
;  Board : 16-pin AI-Thinker ESP32-CAM with OV2640 2 MP sensor
;  Role  : one of the eight orbital capture nodes of the inspection rig
;
;  Build & flash
;  -------------
;     cd esp32_cam_ov2640
;     pio run                       # compile
;     pio run --target upload       # flash (connect a USB-TTL to U0TXD/U0RXD)
;     pio device monitor -b 115200  # serial log
;
;  The 16-pin module has no USB bridge, so flashing needs a 3.3 V USB-TTL
;  adapter wired as:  TX -> U0RXD (GPIO3) | RX -> U0TXD (GPIO1) | GND -> GND
;  and GPIO0 pulled to GND at power-up to enter the serial bootloader.
;  In normal field operation only 5V and GND are connected.
; ============================================================================

[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino

monitor_speed      = 115200
upload_speed       = 460800
board_build.f_cpu  = 240000000L
board_build.partitions = huge_app.csv

; PSRAM must be enabled: an UXGA JPEG plus the TLS buffers do not fit in the
; 320 kB of internal SRAM.  The firmware falls back to SVGA when a board has
;  no PSRAM, but the 16-pin AI-Thinker module always ships with 4 MB PSRAM.
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; ---------------------------------------------------------------------------
; Library dependencies
; ---------------------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3

; esp_camera, WiFi, WiFiClientSecure and HTTPClient ship with the Arduino
; ESP32 core, so no extra dependencies are required for the camera, the TLS
; client or the multipart upload.

; ---------------------------------------------------------------------------
; Optional build tweaks
; ---------------------------------------------------------------------------
; debug_env: same target but with verbose core logging and no optimisation --
; useful when a field node refuses to associate with the AP.
[env:esp32cam-debug]
platform  = espressif32
board     = esp32cam
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DLOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
build_type = debug
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
